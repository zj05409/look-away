name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a versioned release (tag v<VERSION>) from the selected ref"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build LookAway.app
        run: ./build.sh --zip-only

      - name: Resolve artifact names
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short HEAD)"
          ZIP="build/LookAway-${VERSION}-${SHA}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          test -f "$ZIP"
          # Releases serve the file under its own name; `gh release create file#label`
          # only sets a display label, so stage a copy with the stable download name.
          cp "$ZIP" build/LookAway.app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookAway-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.sha }}"
          ZIP="${{ steps.meta.outputs.zip }}"
          NOTES="Latest build from \`main\` (${SHA}).

          **Install**
          1. Download \`LookAway.app.zip\`
          2. Unzip
          3. Drag \`LookAway.app\` into **/Applications**
          4. First open: right-click → **Open** if macOS Gatekeeper blocks it

          **Android**: download \`LookAway.apk\` on the phone and allow installing from this source.

          Version in this build: **${VERSION}** (\`${SHA}\`)."
          gh release view latest >/dev/null 2>&1 \
            && gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "build/LookAway.app.zip" \
            --title "Latest (${VERSION})" \
            --notes "$NOTES" \
            --latest

      - name: Publish versioned release (tag or manual)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.sha }}"
          ZIP="${{ steps.meta.outputs.zip }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TAG_ARGS=(--verify-tag)
          else
            # Manual release: gh creates tag v<VERSION> at the built commit.
            TAG="v${VERSION}"
            TAG_ARGS=(--target "$GITHUB_SHA")
          fi
          # Section of CHANGELOG.md for this version (between its heading and the next).
          CHANGES="$(awk -v v="$VERSION" '$0 == "## " v {found=1; next} /^## / {found=0} found' CHANGELOG.md 2>/dev/null || true)"
          NOTES="Look Away **${TAG}**
          ${CHANGES}

          **Install**
          1. Download \`LookAway.app.zip\` below
          2. Unzip and drag \`LookAway.app\` into **/Applications**
          3. First open: right-click → **Open** if Gatekeeper blocks it

          **Android**: download \`LookAway.apk\` on the phone and allow installing from this source.

          Bundle version: ${VERSION} (\`${SHA}\`)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release refreshes its zip and notes instead of failing.
            gh release upload "$TAG" build/LookAway.app.zip --clobber
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep -vx -e 'LookAway.app.zip' -e 'LookAway.apk' \
              | while read -r OLD; do gh release delete-asset "$TAG" "$OLD" --yes; done
            gh release edit "$TAG" --title "Look Away ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" \
              "build/LookAway.app.zip" \
              --title "Look Away ${VERSION}" \
              --notes "$NOTES" \
              "${TAG_ARGS[@]}"
          fi

  android:
    name: Android app
    # Runs after the macOS job so the GitHub Release exists before the APK is attached.
    needs: macos
    runs-on: ubuntu-latest
    env:
      LOOKAWAY_KEYSTORE_BASE64: ${{ secrets.LOOKAWAY_KEYSTORE_BASE64 }}
      LOOKAWAY_KEYSTORE_PASSWORD: ${{ secrets.LOOKAWAY_KEYSTORE_PASSWORD }}
      LOOKAWAY_KEY_ALIAS: ${{ secrets.LOOKAWAY_KEY_ALIAS }}
      LOOKAWAY_KEY_PASSWORD: ${{ secrets.LOOKAWAY_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release signing key
        if: env.LOOKAWAY_KEYSTORE_BASE64 != ''
        run: |
          echo "$LOOKAWAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lookaway.jks"
          echo "LOOKAWAY_KEYSTORE_FILE=$RUNNER_TEMP/lookaway.jks" >> "$GITHUB_ENV"

      - name: Test and build APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease -PversionCode="$(git rev-list --count HEAD)"

      - name: Resolve artifact names
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short HEAD)"
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/LookAway.apk
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookAway-android-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: build/LookAway.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to latest release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest build/LookAway.apk --clobber

      - name: Attach APK to versioned release (tag or manual)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ steps.meta.outputs.version }}"
          fi
          gh release upload "$TAG" build/LookAway.apk --clobber
