name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build LookAway.app
        run: ./build.sh --zip-only

      - name: Resolve artifact names
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short HEAD)"
          ZIP="build/LookAway-${VERSION}-${SHA}.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          test -f "$ZIP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LookAway-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.sha }}"
          ZIP="${{ steps.meta.outputs.zip }}"
          NOTES="Latest build from \`main\` (${SHA}).

          **Install**
          1. Download \`LookAway.app.zip\`
          2. Unzip
          3. Drag \`LookAway.app\` into **/Applications**
          4. First open: right-click → **Open** if macOS Gatekeeper blocks it

          Version in this build: **${VERSION}** (\`${SHA}\`)."
          gh release view latest >/dev/null 2>&1 \
            && gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "$ZIP#LookAway.app.zip" \
            --title "Latest (${VERSION})" \
            --notes "$NOTES" \
            --latest

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.sha }}"
          ZIP="${{ steps.meta.outputs.zip }}"
          NOTES="Look Away **${TAG}**

          **Install**
          1. Download \`LookAway.app.zip\` below
          2. Unzip and drag \`LookAway.app\` into **/Applications**
          3. First open: right-click → **Open** if Gatekeeper blocks it

          Bundle version: ${VERSION} (\`${SHA}\`)."
          gh release create "$TAG" \
            "$ZIP#LookAway.app.zip" \
            --title "Look Away ${VERSION}" \
            --notes "$NOTES" \
            --verify-tag
